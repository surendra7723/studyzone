name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Nightly dependency upgrade review (deps-upgrade job)
    - cron: '0 6 * * *'

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: django_test_db
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: django_secure_password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.13'
          python-version: '3.12.11'
          enable-cache: true
          cache-dependency-path: uv.lock

      - name: Verify lockfile freshness
        run: uv lock --check

      - name: Security audit (OSV scan of lockfile)
        run: uv audit

      - name: Install dependencies (from lockfile)
        run: uv sync --frozen --group dev

      - name: Verify offline install (air-gapped capability)
        run: uv sync --frozen --group dev --offline

      - name: Performance benchmark
        if: always()
        run: |
          curl -sSfL https://github.com/sharkdp/hyperfine/releases/download/v1.20.0/hyperfine-v1.20.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/hf.tar.gz
          tar -xzf /tmp/hf.tar.gz -C /tmp
          /tmp/hyperfine-v1.20.0-x86_64-unknown-linux-musl/hyperfine \
            --warmup 2 --runs 5 \
            --export-json benchmark.json \
            'uv lock --check' \
            'uv sync --frozen --group dev'

      - name: Code Quality (Linting with Flake8)
        env:
          # Match these with the Postgres service above or use SQLite for simpler testing
          SECRET_KEY: "django-insecure-ci-testing-fallback-key-12345"
        run: |
          uv run flake8 . \
            --exclude=.venv,venv \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

          uv run flake8 . \
            --exclude=.venv,venv \
            --count \
            --exit-zero \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics

      - name: Run Django Tests
        env:
          # Match these with the Postgres service above or use SQLite for simpler testing
          DB_NAME: "django_test_db"
          DB_USER: "django_user"
          DB_PASSWORD: "django_secure_password"
          DB_HOST: "127.0.0.1"
          DB_PORT: "5432"
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG: "False"
        run: |
          uv run python manage.py test --keepdb

      - name: Dependency snapshot
        if: always()
        run: |
          uv pip list --format=json > dependency-snapshot.json
          uv export --format requirements-txt --no-dev > dependency-snapshot.txt
      - name: Upload dependency snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-snapshot
          path: |
            dependency-snapshot.json
            dependency-snapshot.txt
            benchmark.json
            sbom.json

      - name: Build production image
        if: always()
        run: docker build --tag studyzone:${{ github.sha }} --target production .

      - name: Container image scan
        if: always()
        run: |
          # SBOM generation (syft) + grype hard gate on HIGH/CRITICAL.
          # Installs tools via curl; fails the build on any unfixed HIGH/CRITICAL finding.
          curl -sSfL https://github.com/anchore/syft/releases/download/v1.20.0/syft_1.20.0_linux_amd64.tar.gz -o /tmp/syft.tgz
          tar -xzf /tmp/syft.tgz -C /tmp syft
          /tmp/syft studyzone:${{ github.sha }} -o json > sbom.json
          # grype < 0.116 cannot migrate the current vulnerability DB schema
          # (anchore/grype#3586): "unable to migrate: UNIQUE constraint
          # failed: operating_systems...". Keep this pin in sync with a
          # release that supports the published DB schema.
          curl -sSfL https://github.com/anchore/grype/releases/download/v0.120.1/grype_0.120.1_linux_amd64.tar.gz -o /tmp/grype.tgz
          tar -xzf /tmp/grype.tgz -C /tmp grype
          /tmp/grype studyzone:${{ github.sha }} --only-fixed --fail-on high

  # Validates that the locked dependency set resolves and installs cleanly
  # across the supported Python 3.12 patch range (marker compatibility).
  # Requires the lockfile to be resolvable for each patch version.
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12.11', '3.12.13']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.13'
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-path: uv.lock

      - name: Install dependencies (from lockfile)
        run: uv sync --frozen --group dev

      - name: Verify core imports
        run: |
          uv run python -c "import django, rest_framework, channels_redis, psycopg, gunicorn, daphne, whitenoise; print('OK on ${{ matrix.python-version }}')"

  # Nightly dependency upgrade bot. Renovate/Dependabot understand uv.lock;
  # this job re-locks against current releases so a human can review the diff.
  deps-upgrade:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.13'
          python-version: '3.12.11'
          enable-cache: true
          cache-dependency-path: uv.lock

      - name: Re-lock with latest allowed versions
        run: |
          uv lock --upgrade
          uv audit

      - name: Upload updated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: uv-lock-upgrade
          path: uv.lock

  # Deploy gate: runs only on main after tests and lint pass. Replace the
  # commented example with your real deployment target (SSH or webhook).
  deploy:
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.13'
          python-version: '3.12.11'
          enable-cache: true
          cache-dependency-path: uv.lock

      - name: Install dependencies (from lockfile)
        run: uv sync --frozen --group dev

      # Example option A: Automated Deploying via SSH directly to a VPS
      # - name: Deploy to Ubuntu Server via SSH
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.SERVER_HOST }}
      #     username: ${{ secrets.SERVER_USER }}
      #     key: ${{ secrets.SERVER_SSH_KEY }}
