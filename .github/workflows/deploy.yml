name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: django_test_db
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: django_secure_password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Speeds up subsequent runs by caching package layers

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt

      - name: Code Quality (Linting with Flake8)
        env:
          # Match these with the Postgres service above or use SQLite for simpler testing
          SECRET_KEY: "django-insecure-ci-testing-fallback-key-12345"
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Django Tests
        env:
          # Match these with the Postgres service above or use SQLite for simpler testing
          DB_NAME: "django_test_db"
          DB_USER: "django_user"
          DB_PASSWORD: "django_secure_password"
          DB_HOST: "127.0.0.1"
          DB_PORT: "5432"
          SECRET_KEY: ${ secrets.DJANGO_SECRET_KEY }
          DEBUG: "False"


        run: |
          python manage.py test

  deploy:
    needs: test-and-lint # Runs only if the linting and testing steps pass perfectly
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' # Only deploy on commits to main

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Example option A: Automated Deploying via SSH directly to a VPS
      - name: Deploy to Ubuntu Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/my-django-app
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt
            python manage.py migrate
            python manage.py collectstatic --noinput
            sudo systemctl restart gunicorn

      # Example option B: Deploying directly to a Cloud Web Service Hook (uncomment if using Render)
      # - name: Trigger Render Deploy Hook
      #   run: |
      #     curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
