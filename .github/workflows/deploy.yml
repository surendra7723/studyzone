name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
 
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: django_test_db
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: django_secure_password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.12'

      - name: Create venv
        run: uv venv

      - name: Install Dependencies
        run: uv pip install -r requirements/dev.txt

      - name: Code Quality (Linting with Flake8)
        env:
          # Match these with the Postgres service above or use SQLite for simpler testing
          SECRET_KEY: "django-insecure-ci-testing-fallback-key-12345"
        run: |
          uv run flake8 . \
            --exclude=.venv,venv \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

          uv run flake8 . \
            --exclude=.venv,venv \
            --count \
            --exit-zero \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics

      - name: Run Django Tests
        env:
          # Match these with the Postgres service above or use SQLite for simpler testing
          DB_NAME: "django_test_db"
          DB_USER: "django_user"
          DB_PASSWORD: "django_secure_password"
          DB_HOST: "127.0.0.1"
          DB_PORT: "5432"
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG: "False"
        run: |
          uv run python manage.py test --keepdb

