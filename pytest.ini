[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    integration: Integration tests that test multiple components working together
    slow: Tests that take longer to run (e.g., real-time features, external services)
    requires_redis: Tests that require Redis connection
    requires_celery: Tests that require Celery worker
testpaths = 
    tests
    apps
    dictionary_app
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
